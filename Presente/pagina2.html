<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Página 2 ❤️</title>

  <style>

    body{
      margin:0;
      width:100vw;
      height:100vh;

      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background-image:url('./kor.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      font-family:Arial;

      position:relative;
    }

    .gato2{
      width:150px;
      position:absolute;
      left:30%;
      bottom:66%;
      transform:translateX(-50%);
      opacity:0;
      animation: subirGato 2s ease-out forwards;
    }

    @keyframes subirGato{
      0%{ bottom:-400px; opacity:0; }
      100%{ bottom:66%; opacity:1; }
    }

    .balao{
      width:180px;
      position:absolute;
      left:78%;
      bottom:80%;
      transform:translateX(-50%);
      opacity:0;
      animation: aparecerBalao 1.5s ease-out forwards;
      animation-delay:2s;
    }

    @keyframes aparecerBalao{
      0%{ opacity:0; transform:translateX(-50%) scale(0.5); }
      100%{ opacity:1; transform:translateX(-80%) scale(1); }
    }

    .texto{
      position:absolute;
      bottom:20%;
      width:80%;
      text-align:center;
      color:white;
      font-size:28px;
      font-weight:bold;
      opacity:0;
      display:none;
      animation: piscar 1s infinite;
      text-shadow:0 0 10px black;
    }

    @keyframes piscar{
      0%{opacity:1;}
      50%{opacity:0;}
      100%{opacity:1;}
    }

    #somBtn{
      position:fixed;
      top:15px;
      right:15px;
      z-index:9999;

      background:rgba(0,0,0,0.5);
      color:white;

      border:none;
      border-radius:10px;

      padding:10px;
      font-size:18px;
      cursor:pointer;
    }

  </style>
</head>

<body>

  <!-- ÁUDIO (IMPORTANTE) -->
  <audio id="musica" loop>
    <source src="./musica.mp3" type="audio/mp3">
  </audio>

  <button id="somBtn" onclick="toggleSom()">🔊</button>

  <!-- GATO -->
  <img class="gato2" src="./gatopergunta.png">

  <!-- BALÃO -->
  <img class="balao" src="./balao.png">

  <!-- TEXTO -->
  <div class="texto" id="texto">
    Vai gostosa, clica seu dedo na tela pra ir pras perguntas
  </div>

  <script>

  /* MOSTRA TEXTO */
  setTimeout(() => {
    document.getElementById("texto").style.display = "block";
  }, 5000);

  /* CLIQUE PRA PRÓXIMA PÁGINA */
  document.body.addEventListener("click", () => {

    if(document.getElementById("texto").style.display === "block"){
      window.location.href = "pagina3.html";
    }

  });

  /* ===== MÚSICA (MESMO SISTEMA DA PÁGINA 1) ===== */

  let musica;
  let btn;

  window.addEventListener("load", () => {

    musica = document.getElementById("musica");
    btn = document.getElementById("somBtn");

    const tempoSalvo = localStorage.getItem("tempoMusica");

    if(tempoSalvo && musica){
      musica.currentTime = parseFloat(tempoSalvo);
    }

    iniciarMusica();

  });

  setInterval(() => {
    if(musica && !musica.paused){
      localStorage.setItem("tempoMusica", musica.currentTime);
    }
  }, 500);

  function iniciarMusica(){

    if(!musica) return;

    musica.play().catch(()=>{});

  }

  function toggleSom(){

    if(!musica) return;

    if(musica.paused){
      musica.play();
      btn.innerText = "🔊";
    }else{
      musica.pause();
      btn.innerText = "🔇";
    }

  }

  </script>

</body>
</html>
