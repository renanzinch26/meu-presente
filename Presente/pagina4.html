<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Página 4 ❤️</title>

  <style>

    body{
      margin:0;
      width:100vw;
      height:100vh;

      overflow:hidden;

      background-image:url('./kor.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      position:relative;
      font-family:Arial;
    }

    /* CÃO */
    .cao{
      width:280px;

      position:absolute;

      left:50%;
      bottom:20%;

      transform:translateX(-50%);

      opacity:0;

      animation: aparecer 2s ease-out forwards;
    }

    @keyframes aparecer{
      0%{
        opacity:0;
        transform:translateX(-50%) scale(0.6);
      }

      100%{
        opacity:1;
        transform:translateX(-50%) scale(1);
      }
    }

    /* TEXTO PISCANDO */
    .texto{
      position:absolute;

      bottom:15%;

      width:60%;

      left:50%;
      transform:translateX(-50%);

      text-align:center;

      color:white;

      font-size:24px;

      font-weight:bold;

      text-shadow:0 0 10px black;

      animation: piscar 1s infinite;

    }

    @keyframes piscar{
      0%{opacity:1;}
      50%{opacity:0;}
      0%{opacity:1;}
    }
#somBtn{
  position:fixed;
  top:15px;
  right:15px;

  z-index:9999;

  background:rgba(0,0,0,0.5);
  color:white;

  border:none;
  border-radius:10px;

  padding:10px;

  font-size:18px;

  cursor:pointer;
}
  </style>
  
</head>

<body>


<body onclick="irProxima()">

  <!-- CÃO -->
  <img class="cao" src="./cao1.png">

  <!-- TEXTO -->
  <div class="texto">
    Vai delicia, clica com esse teu dedo gostoso na tela
  </div>

  <script>
    function irProxima(){
      window.location.href = "pagina5.html";
    }
  </script>

</body>
</html>
