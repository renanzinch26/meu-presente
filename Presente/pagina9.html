<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Página 9 ❤️</title>

  <style>

    body{
      margin:0;

      background-image:url('./kor.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      font-family:Arial;
    }

    /* SCROLL */
    .container{
      min-height:200vh;

      display:flex;
      flex-direction:column;
      align-items:center;

      padding:20px;
      box-sizing:border-box;
    }

    /* GALERIA PEQUENA */
    .galeria{
      width:100%;
      max-width:600px;

      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;

      margin-top:20px;
    }

    .galeria img{
      width:28%;

      border-radius:12px;

      box-shadow:0 0 10px rgba(0,0,0,0.4);

      object-fit:cover;

      position:relative;
      z-index:2;
    }

    /* CARTA GRANDE */
    .carta{
      width:120%;
      max-width:600px;

      margin-top:5px;

      position:relative;
      top:-10px;

      border-radius:20px;


      z-index:1;
    }

    /* NOVA IMAGEM ENTRE CARTA E VÍDEO */
    .meio{
      width:100%;
      max-width:600px;

      margin-top:20px;

      border-radius:15px;

      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    /* ESPAÇO */
    .espaco{
      flex:1;
      min-height:10vh;
    }

    /* VÍDEO FINAL */
    .video-box{
      width:100%;
      max-width:600px;

      aspect-ratio:16/9;

      margin-top:40px;
      margin-bottom:40px;

      border-radius:15px;

      overflow:hidden;

      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    video{
      width:100%;
      height:100%;
    }

  </style>
</head>

<body>
    <audio id="musica" loop>
  <source src="./musica.mp3" type="audio/mp3">
</audio>
<button id="somBtn" onclick="toggleSom()">🔊</button>

  <div class="container">

    <!-- GALERIA -->
    <div class="galeria">
      <img src="./f1.jpg">
      <img src="./f2.jpg">
      <img src="./f3.jpg">
      <img src="./download-_4_.jpg">
      <img src="./gh.jpg">
    </div>

    <!-- CARTA GRANDE -->
    <img class="carta" src="./texto2.png">

    <!-- NOVA IMAGEM (VOCÊ VAI ESCOLHER) -->
    <img class="meio" src="./vose-quer__.jpg">

    <!-- ESPAÇO -->
    <div class="espaco"></div>

    <!-- VÍDEO FINAL -->
    <div class="video-box">

      <video controls>
        <source src="./videoo (2).mp4" type="video/mp4">
      </video>

    </div>

  </div>
<script>

const musica = document.getElementById("musica");
const btn = document.getElementById("somBtn");

/* SALVAR POSIÇÃO DA MÚSICA */
setInterval(() => {
  if(musica && !musica.paused){
    localStorage.setItem("tempoMusica", musica.currentTime);
  }
}, 500);

/* RESTAURAR POSIÇÃO */
window.addEventListener("load", () => {

  const tempoSalvo = localStorage.getItem("tempoMusica");

  if(tempoSalvo && musica){
    musica.currentTime = parseFloat(tempoSalvo);
  }

});

/* INICIAR MÚSICA */
function iniciarMusica(){

  if(!musica) return;

  musica.volume = 1;

  const playPromise = musica.play();

  if(playPromise !== undefined){
    playPromise.catch(() => {
      console.log("Bloqueado pelo navegador até interação");
    });
  }

}

/* TOGGLE SOM */
function toggleSom(){

  if(!musica) return;

  if(musica.paused){
    musica.play();
    btn.innerText = "🔊";
  }else{
    musica.pause();
    btn.innerText = "🔇";
  }

}

</script>
</body>
</html>
