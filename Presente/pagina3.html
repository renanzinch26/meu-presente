<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Página 3 ❤️</title>

  <style>

    body{
      margin:0;
      width:100vw;
      height:100vh;

      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      position:relative;

      background-image:url('./kor.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      font-family:Arial;
    }

    .quiz-box{
      width:85%;
      max-width:350px;

      background:rgba(255,255,255,0.95);
      border-radius:25px;

      padding:25px;
      text-align:center;

      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .foto{
      width:50%;
      border-radius:20px;
      margin-bottom:20px;
    }

    .pergunta{
      font-size:22px;
      font-weight:bold;
      color:#222;
      margin-bottom:20px;
    }

    .resposta{
      width:100%;
      padding:15px;

      border:none;
      border-radius:15px;

      background:#f0f0f0;
      font-size:18px;

      outline:none;
      box-sizing:border-box;
    }

    .botao{
      margin-top:20px;
      width:100%;

      padding:15px;
      border:none;

      border-radius:15px;
      background:#ff4fa3;

      color:white;
      font-size:18px;

      cursor:pointer;
    }

    .erro{
      margin-top:15px;
      color:red;
      font-size:16px;
    }

    #somBtn{
      position:fixed;
      top:15px;
      right:15px;

      z-index:9999;

      background:rgba(0,0,0,0.5);
      color:white;

      border:none;
      border-radius:10px;

      padding:10px;

      font-size:18px;

      cursor:pointer;
    }

  </style>
</head>

<body>

  <!-- ÁUDIO -->
  <audio id="musica" loop>
    <source src="./musica.mp3" type="audio/mp3">
  </audio>

  <button id="somBtn" onclick="toggleSom()">🔊</button>

  <div class="quiz-box">

    <img class="foto" src="./foto1.jpeg">

    <div class="pergunta">
      Que filmes fomos ver no dia em que tiramos essa foto?(escreva tudo minusculo)
    </div>

    <input
      type="text"
      class="resposta"
      id="resposta"
      placeholder="Digite aqui"
      oninput="limparErro()"
    >

    <button class="botao" onclick="verificarResposta()">
      Responder
    </button>

    <div class="erro" id="erro"></div>

  </div>

<script>

/* ===== MÚSICA GLOBAL (SÓ SE LIBERADO NA SENHA) ===== */

let musica;
let btn;

window.addEventListener("load", () => {

  musica = document.getElementById("musica");
  btn = document.getElementById("somBtn");

  const liberou = localStorage.getItem("liberouMusica");

  if(liberou === "true"){

    const tempoSalvo = localStorage.getItem("tempoMusica");

    if(tempoSalvo && musica){
      musica.currentTime = parseFloat(tempoSalvo);
    }

    iniciarMusica();

  }

});

/* SALVAR POSIÇÃO */
setInterval(() => {
  if(musica && !musica.paused){
    localStorage.setItem("tempoMusica", musica.currentTime);
  }
}, 500);

/* INICIAR */
function iniciarMusica(){

  if(!musica) return;

  musica.volume = 1;
  musica.play().catch(()=>{});

}

/* TOGGLE */
function toggleSom(){

  if(!musica) return;

  if(musica.paused){
    musica.play();
    btn.innerText = "🔊";
  }else{
    musica.pause();
    btn.innerText = "🔇";
  }

}

/* QUIZ */
const respostaCorreta = "divertida mente 2";

function verificarResposta(){

  const resposta = document.getElementById("resposta").value.toLowerCase();

  if(resposta === respostaCorreta){
    window.location.href = "pagina4.html";
  }else{
    document.getElementById("erro").innerText = "Errou meu amor 😭";
  }

}

function limparErro(){
  document.getElementById("erro").innerText = "";
}

</script>

</body>
</html>
