<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Página 5 ❤️</title>

  <style>

    body{
      margin:0;
      width:100vw;
      height:100vh;

      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background-image:url('./kor.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      font-family:Arial;

      position:relative;
    }

    .quiz-box{
      width:85%;
      max-width:350px;

      background:rgba(255,255,255,0.95);

      border-radius:25px;

      padding:25px;

      text-align:center;

      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .pergunta{
      font-size:22px;
      font-weight:bold;
      color:#222;
      margin-bottom:20px;
    }

    .resposta{
      width:100%;

      padding:15px;

      border:none;

      border-radius:15px;

      background:#f0f0f0;

      font-size:18px;

      box-sizing:border-box;

      outline:none;
    }

    .botao{
      margin-top:20px;

      width:100%;
      padding:15px;

      border:none;

      border-radius:15px;

      background:#ff4fa3;

      color:white;

      font-size:18px;

      cursor:pointer;
    }

    .erro{
      margin-top:15px;
      color:red;
      font-size:16px;
    }

    #somBtn{
  position:fixed;
  top:15px;
  right:15px;

  z-index:9999;

  background:rgba(0,0,0,0.5);
  color:white;

  border:none;
  border-radius:10px;

  padding:10px;

  font-size:18px;

  cursor:pointer;
}
  </style>
  
</head>
<body>

<body>

  <div class="quiz-box">

    <div class="pergunta">
      Qual foi o presente mais delicioso que voce ja me deu?
    </div>

    <input
      type="text"
      id="resposta"
      class="resposta"
      placeholder="Digite aqui..."
      oninput="limparErro()"
    >

    <button class="botao" onclick="verificarResposta()">
      Responder
    </button>

    <div class="erro" id="erro"></div>

  </div>

  <script>

    const respostaCorreta = "buceta";

    function verificarResposta(){

      const resposta =
      document.getElementById("resposta").value.toLowerCase();

      if(resposta === respostaCorreta){

        window.location.href = "pagina6.html";

      }else{

        document.getElementById("erro").innerText =
        "Errou meu amor 😭";

      }

    }

    function limparErro(){
      document.getElementById("erro").innerText = "";
    }

  </script>

</script>

</body>
</html>
